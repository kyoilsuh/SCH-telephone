<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>순천향대학교 교원 전화번호부</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #003087; --navy-light: #1a4fa0; --blue: #2d6fd6;
  --accent: #e8f1ff; --bg: #f2f5fb; --white: #ffffff;
  --text: #111827; --muted: #6b7280; --border: #dce4f0;
  --shadow: 0 2px 12px rgba(0,48,135,0.10); --r: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.header {
  background: linear-gradient(135deg, #002570 0%, #003087 60%, #1a4fa0 100%);
  padding: 18px 16px 14px; position: sticky; top: 0; z-index: 200;
  box-shadow: 0 3px 16px rgba(0,37,112,0.35);
}
.header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.header-title { flex: 1; }
.header-title h1 { font-size: 15px; font-weight: 700; color: white; letter-spacing: -0.3px; }
.header-title p { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 1px; }
.total-badge { background: rgba(255,255,255,0.15); color: white; border-radius: 20px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
.search-row { display: flex; gap: 8px; align-items: center; }
.search-input {
  flex: 1; background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.28);
  border-radius: 12px; padding: 11px 14px; color: white; font-size: 15px;
  font-family: 'Noto Sans KR', sans-serif; outline: none; transition: all 0.2s;
}
.search-input::placeholder { color: rgba(255,255,255,0.5); }
.search-input:focus { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.55); }
.clear-btn {
  background: rgba(255,255,255,0.18); border: none; color: white;
  border-radius: 10px; width: 40px; height: 40px; font-size: 17px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.clear-btn:active { background: rgba(255,255,255,0.32); }
.chosung-bar {
  background: white; border-bottom: 1px solid var(--border);
  padding: 10px 12px; overflow-x: auto; white-space: nowrap; scrollbar-width: none;
}
.chosung-bar::-webkit-scrollbar { display: none; }
.cs-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 37px; height: 37px; border-radius: 10px;
  border: 1.5px solid var(--border); background: white; color: var(--text);
  font-size: 15px; font-weight: 600; margin-right: 5px; cursor: pointer;
  transition: all 0.15s; font-family: 'Noto Sans KR', sans-serif;
}
.cs-btn.on { background: var(--navy); border-color: var(--navy); color: white; }
.cs-btn:active { transform: scale(0.88); }
.filter-bar {
  background: white; border-bottom: 1px solid var(--border);
  padding: 8px 12px; display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; padding: 5px 13px; border-radius: 20px;
  border: 1.5px solid var(--border); background: white; font-size: 13px; color: var(--muted);
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
  font-family: 'Noto Sans KR', sans-serif; font-weight: 500;
}
.chip.on { background: var(--accent); border-color: var(--blue); color: var(--navy); font-weight: 700; }
.stats { padding: 10px 16px 4px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.stats strong { color: var(--navy); font-size: 16px; font-weight: 700; }
.cards { padding: 6px 14px 90px; }
.card {
  background: white; border-radius: var(--r); padding: 15px 16px; margin-bottom: 9px;
  box-shadow: var(--shadow); border: 1.5px solid transparent; transition: border-color 0.15s;
}
.card:active { border-color: var(--blue); }
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.card-name { font-size: 18px; font-weight: 700; letter-spacing: -0.4px; flex: 1; }
.badge { font-size: 11px; color: white; padding: 3px 9px; border-radius: 6px; font-weight: 600; white-space: nowrap; }
.badge-univ { background: #003087; }
.badge-seoul { background: #c0392b; }
.badge-cheonan { background: #27ae60; }
.badge-bucheon { background: #8e44ad; }
.badge-gumi { background: #e67e22; }
.card-dept { font-size: 13px; font-weight: 600; color: var(--navy-light); margin-bottom: 3px; }
.card-pos { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.card-phone-row { display: flex; align-items: center; gap: 8px; }
.phone-num { font-size: 17px; font-weight: 700; color: var(--navy); text-decoration: none; letter-spacing: 0.3px; }
.call-btn {
  margin-left: auto; background: var(--navy); color: white; border: none;
  border-radius: 10px; padding: 9px 18px; font-size: 14px; font-weight: 700;
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
}
.call-btn:active { background: var(--blue); }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty .ico { font-size: 52px; margin-bottom: 14px; }
.empty p { font-size: 15px; line-height: 1.7; }
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #111827; color: white; padding: 12px 22px; border-radius: 12px;
  font-size: 14px; font-weight: 500; transition: transform 0.3s; z-index: 999; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

</div>

const CHOSUNG_ALL = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const CHOSUNG_BTN = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

function getChosung(ch) {
  const code = ch.charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return ch;
  return CHOSUNG_ALL[Math.floor(code / 28 / 21)];
}
function nameToChosung(name) { return [...name].map(getChosung).join(''); }

const HOSPITALS = ['전체','대학','서울병원','천안병원','부천병원','구미병원'];
const HOSP_LABEL = {'전체':'🏠 전체','대학':'🎓 대학','서울병원':'🏥 서울','천안병원':'🏥 천안','부천병원':'🏥 부천','구미병원':'🏥 구미'};
const BADGE = {'대학':'badge-univ','서울병원':'badge-seoul','천안병원':'badge-cheonan','부천병원':'badge-bucheon','구미병원':'badge-gumi'};

let activeCS = '';
let activeHosp = '전체';

const csBar = document.getElementById('chosungBar');
CHOSUNG_BTN.forEach(ch => {
  const b = document.createElement('button');
  b.className = 'cs-btn'; b.textContent = ch;
  b.onclick = () => {
    activeCS = (activeCS === ch) ? '' : ch;
    csBar.querySelectorAll('.cs-btn').forEach(x => x.classList.toggle('on', x.textContent === activeCS));
    render();
  };
  csBar.appendChild(b);
});

const filterBar = document.getElementById('filterBar');
HOSPITALS.forEach(h => {
  const c = document.createElement('button');
  c.className = 'chip' + (h === '전체' ? ' on' : '');
  c.textContent = HOSP_LABEL[h];
  c.onclick = () => {
    activeHosp = h;
    filterBar.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    render();
  };
  filterBar.appendChild(c);
});

document.getElementById('searchInput').addEventListener('input', render);

function clearAll() {
  document.getElementById('searchInput').value = '';
  activeCS = ''; activeHosp = '전체';
  csBar.querySelectorAll('.cs-btn').forEach(x => x.classList.remove('on'));
  filterBar.querySelectorAll('.chip').forEach((x,i) => x.classList.toggle('on', i===0));
  render();
}

function render() {
  const q = document.getElementById('searchInput').value.trim();
  const isChosungQ = q.length > 0 && [...q].every(c => CHOSUNG_BTN.includes(c));

  const filtered = ALL_DATA.filter(d => {
    if (activeHosp !== '전체' && d.hospital !== activeHosp) return false;
    if (activeCS && getChosung(d.name[0]) !== activeCS) return false;
    if (q) {
      if (isChosungQ) {
        if (!nameToChosung(d.name).includes(q)) return false;
      } else {
        const hay = [d.name, d.dept, d.hospital, d.phone, d.position].join(' ').toLowerCase();
        if (!hay.includes(q.toLowerCase())) return false;
      }
    }
    return true;
  });

  document.getElementById('stats').innerHTML = `검색 결과: <strong>${filtered.length.toLocaleString()}</strong>명`;

  const el = document.getElementById('cards');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="ico">🔍</div><p>검색 결과가 없어요<br><small>다른 이름이나 초성으로 검색해 보세요</small></p></div>`;
    return;
  }

  el.innerHTML = filtered.map(d => {
    const bc = BADGE[d.hospital] || 'badge-univ';
    const tel = d.phone.replace(/[^0-9+]/g,'');
    return `<div class="card">
      <div class="card-head">
        <span class="card-name">${d.name}</span>
        <span class="badge ${bc}">${d.hospital}</span>
      </div>
      ${d.dept ? `<div class="card-dept">🏢 ${d.dept}</div>` : ''}
      ${d.position ? `<div class="card-pos">  ${d.position}</div>` : ''}
      <div class="card-phone-row">
        <a class="phone-num" href="tel:${tel}">${d.phone}</a>
        <a class="call-btn" href="tel:${tel}">📞 전화</a>
      </div>
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
